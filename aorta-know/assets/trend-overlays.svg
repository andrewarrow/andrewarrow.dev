<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480">
  <title>Comparing shorter and longer trends</title>
  <desc>An illustrative chart with a burgundy seven-day trend and a dashed gray twenty-one-day trend, showing how shorter changes sit within a broader pattern. This is not personal health data or an app screenshot.</desc>
  <rect width="760" height="480" rx="0" fill="#eae4dd"/>
  <g font-family="Avenir Next, Helvetica, Arial, sans-serif" fill="#281c20">
    <text x="48" y="58" font-size="23" font-weight="600">A closer look. A wider view.</text>
    <text x="48" y="89" font-size="15" fill="#65595a">Compare patterns over the same period</text>
    <g stroke="#c7beb7" stroke-width="1">
      <path d="M48 146H712M48 210H712M48 274H712M48 338H712"/>
    </g>
    <path d="M48 301C81 300 99 273 128 280S172 297 207 247S251 216 283 237S326 258 356 221S404 179 432 200S479 230 506 187S550 139 578 161S619 189 652 140S684 126 712 120" fill="none" stroke="#6e2034" stroke-width="4" stroke-linecap="round"/>
    <path d="M48 297C134 288 186 274 251 254S369 217 432 202S556 169 620 153S682 141 712 137" fill="none" stroke="#65595a" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 8"/>
    <g font-size="14" fill="#65595a">
      <text x="48" y="372">Earlier</text>
      <text x="712" y="372" text-anchor="end">Later</text>
    </g>
    <g font-size="16">
      <path d="M48 424h32" stroke="#6e2034" stroke-width="4" stroke-linecap="round"/>
      <text x="94" y="429">7-day trend</text>
      <path d="M300 424h32" stroke="#65595a" stroke-width="3" stroke-dasharray="9 8" stroke-linecap="round"/>
      <text x="346" y="429">21-day trend</text>
    </g>
  </g>
</svg>
